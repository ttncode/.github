name: App Release
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      context:
        type: string
        required: true
    secrets:
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # a pull request opened with GITHUB_TOKEN starts no workflow of its own —
      # github blocks that so a bot cannot trigger itself — so the checks on the
      # release pull request wait for a human to approve them and go red when
      # they expire. A github app token makes the pull request come from a real
      # identity and the checks simply run.
      #
      # Optional on purpose: a project that has not set the secrets up still
      # releases exactly as before, it just needs that click. Read through env
      # rather than testing `secrets` directly, which is not available to `if`.
      - id: app-token
        if: ${{ env.APP_ID != '' }}
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # attaching these means a client always gets a compose file that matches
      # the image, instead of whatever is on main.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" compose.yaml example.env install.sh --clobber

  deploy:
    needs: [release-please, image]
    if: ${{ needs.release-please.outputs.released == 'true' && vars.DEPLOY_TARGET != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # seam for a future deploy adapter — see docs/decisions/0014 in the
      # scaffold toolbox repo. no target is configured yet, so this job
      # never runs.
      - env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: echo "no deploy adapter is installed for ${DEPLOY_TARGET}" && exit 1
